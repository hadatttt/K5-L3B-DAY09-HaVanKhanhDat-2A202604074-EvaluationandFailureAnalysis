# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Evidence for each code is in the taxonomy (v1) and the v2 run.
ticket_over_db: FM-03          # ticket claims override DB facts (prompt injection, false authority)
stale_policy: FM-06            # superseded / not-yet-effective clause cited by the customer
clause_sum: FM-04              # "add up all clauses" instead of max
double_deduct: FM-05           # prior refund subtracted by the agent AND by the host
sibling_refund: FM-07          # batch refund across sibling claims of the same order
denied_ignored: FM-02          # host denies (expired approval / already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # approval cap below quote: reply must state the capped ledger amount
cross_principal: FM-09         # another principal's order / PII
